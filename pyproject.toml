[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simco2"
version = "0.1.0"
description = "Prototype vérifiable de simulation de transport voyageurs et CO2e"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.8,<3",
  "argon2-cffi>=23,<27",
  "reportlab>=4.2,<5",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
simco2 = "simco2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simco2 = ["ui/*.html", "ui/*.css", "ui/*.js", "adapters/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82"]
